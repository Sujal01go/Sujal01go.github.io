<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#pipeBg)"/>
  
  <g transform="translate(60, 50)">
    <!-- Industrial Cylindrical Pipe Cutaway -->
    <rect x="0" y="30" width="480" height="230" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
    <ellipse cx="20" cy="145" rx="16" ry="110" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <ellipse cx="460" cy="145" rx="16" ry="110" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>

    <!-- Grid / Pipe Inner Contour lines -->
    <line x1="20" y1="65" x2="460" y2="65" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="20" y1="225" x2="460" y2="225" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Defect / Crack Detection Marker on Pipe Wall -->
    <path d="M 380 75 Q 395 90, 390 105" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="388" cy="90" r="14" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <text x="388" y="125" fill="#dc2626" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle" font-weight="700">DEFECT DETECTED</text>

    <!-- Inspection Rover Chassis -->
    <g transform="translate(130, 110)">
      <!-- Wheels / Treads (4 driven wheels) -->
      <rect x="15" y="-15" width="45" height="18" rx="4" fill="#1e293b"/>
      <rect x="110" y="-15" width="45" height="18" rx="4" fill="#1e293b"/>
      <rect x="15" y="70" width="45" height="18" rx="4" fill="#1e293b"/>
      <rect x="110" y="70" width="45" height="18" rx="4" fill="#1e293b"/>

      <!-- Body Chassis -->
      <rect x="25" y="0" width="120" height="72" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
      
      <!-- Embedded Microcontroller / Sensor Core -->
      <circle cx="85" cy="36" r="16" fill="#0369a1"/>
      <text x="85" y="40" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">MCU</text>
      
      <!-- Ultrasonic / LiDAR Sensor Rays -->
      <path d="M 145 36 L 220 10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 145 36 L 240 36" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <path d="M 145 36 L 220 62" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <path d="M 180 18 A 45 45 0 0 1 180 54" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <path d="M 210 10 A 80 80 0 0 1 210 62" stroke="#0ea5e9" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Specs Pill -->
    <rect x="120" y="275" width="240" height="24" rx="12" fill="#0f172a"/>
    <text x="240" y="291" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" text-anchor="middle">AUTONOMOUS EMBEDDED SYSTEM</text>
  </g>
</svg>
