<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="mathGrid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="32" fill="url(#avatarBg)"/>

  <!-- Subtle Mathematical Topology Coordinate Grid -->
  <g stroke="#3b82f6" stroke-width="0.8" opacity="0.18">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>

    <line x1="0" y1="50" x2="500" y2="50"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="0" y1="450" x2="500" y2="450"/>
  </g>

  <!-- Central Dynamic Geometric Rings (Systems & Computing Orbit) -->
  <circle cx="250" cy="230" r="140" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <ellipse cx="250" cy="230" rx="170" ry="80" stroke="#818cf8" stroke-width="1.2" transform="rotate(-25 250 230)" opacity="0.45"/>
  <ellipse cx="250" cy="230" rx="170" ry="80" stroke="#34d399" stroke-width="1.2" transform="rotate(35 250 230)" opacity="0.35"/>

  <!-- Central Monogram Badge -->
  <g transform="translate(190, 170)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" filter="drop-shadow(0 12px 24px rgba(37,99,235,0.3))"/>
    <text x="60" y="76" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-1.5">SK</text>
  </g>

  <!-- Orbiting Nodes / Core Domains -->
  <!-- Node 1: C++ / Systems -->
  <g transform="translate(100, 160)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" fill="#e0f2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">C++</text>
  </g>

  <!-- Node 2: AI / RAG -->
  <g transform="translate(380, 140)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="5" fill="#e0e7ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">AI/RAG</text>
  </g>

  <!-- Node 3: M&C (Math & Computing) -->
  <g transform="translate(150, 340)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="5" fill="#ecfdf5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">M&amp;C</text>
  </g>

  <!-- Node 4: HFT / Systems -->
  <g transform="translate(360, 320)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">LOW-LAT</text>
  </g>

  <!-- Bottom Badge: NIT Jalandhar -->
  <g transform="translate(130, 420)">
    <rect x="0" y="0" width="240" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#10b981"/>
    <text x="130" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">NIT JALANDHAR • M&amp;C</text>
  </g>
</svg>
