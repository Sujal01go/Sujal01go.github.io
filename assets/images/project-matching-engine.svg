<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#engGrad)"/>
  
  <!-- Central Terminal / Order Book Frame -->
  <g transform="translate(60, 45)">
    <!-- Terminal Background -->
    <rect x="0" y="0" width="480" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window controls -->
    <circle cx="24" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="4.5" fill="#10b981"/>
    <text x="240" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" text-anchor="middle" font-weight="500">L3 ORDER BOOK • PRICE-TIME PRIORITY (FIFO)</text>
    <line x1="0" y1="34" x2="480" y2="34" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Left Column: BID / BUY (Green Depth) -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700">BIDS (BUY)</text>
      <text x="110" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">QTY</text>
      <text x="180" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">TIME (µs)</text>

      <!-- Row 1 -->
      <rect x="0" y="24" width="190" height="20" fill="#064e3b" opacity="0.35"/>
      <text x="5" y="38" fill="#10b981" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">182.45</text>
      <text x="110" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">1,450</text>
      <text x="180" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">.00412</text>

      <!-- Row 2 -->
      <rect x="0" y="48" width="160" height="20" fill="#064e3b" opacity="0.25"/>
      <text x="5" y="62" fill="#10b981" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">182.40</text>
      <text x="110" y="62" fill="#e2e8f0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">2,800</text>
      <text x="180" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">.00418</text>

      <!-- Row 3 -->
      <rect x="0" y="72" width="130" height="20" fill="#064e3b" opacity="0.18"/>
      <text x="5" y="86" fill="#10b981" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">182.35</text>
      <text x="110" y="86" fill="#e2e8f0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">5,120</text>
      <text x="180" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">.00425</text>
    </g>

    <!-- Center Divider: Match Core -->
    <line x1="240" y1="40" x2="240" y2="180" stroke="#334155" stroke-dasharray="3 3"/>
    
    <!-- Matching Engine Processor Badge -->
    <circle cx="240" cy="110" r="24" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="240" y="114" fill="#c7d2fe" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" text-anchor="middle">MATCH</text>
    <text x="240" y="124" fill="#a5b4fc" font-family="'JetBrains Mono', monospace, sans-serif" font-size="7" text-anchor="middle">C++20</text>

    <!-- Right Column: ASK / SELL (Red Depth) -->
    <g transform="translate(260, 50)">
      <text x="0" y="14" fill="#f87171" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700">ASKS (SELL)</text>
      <text x="110" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">QTY</text>
      <text x="175" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">TIME (µs)</text>

      <!-- Row 1 -->
      <rect x="0" y="24" width="185" height="20" fill="#7f1d1d" opacity="0.35"/>
      <text x="5" y="38" fill="#f87171" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">182.50</text>
      <text x="110" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">1,200</text>
      <text x="175" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">.00411</text>

      <!-- Row 2 -->
      <rect x="0" y="48" width="145" height="20" fill="#7f1d1d" opacity="0.25"/>
      <text x="5" y="62" fill="#f87171" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">182.55</text>
      <text x="110" y="62" fill="#e2e8f0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">3,450</text>
      <text x="175" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">.00419</text>

      <!-- Row 3 -->
      <rect x="0" y="72" width="115" height="20" fill="#7f1d1d" opacity="0.18"/>
      <text x="5" y="86" fill="#f87171" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">182.60</text>
      <text x="110" y="86" fill="#e2e8f0" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">4,900</text>
      <text x="175" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10">.00428</text>
    </g>

    <!-- Bottom Latency Telemetry -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="440" height="65" rx="6" fill="#020617" stroke="#1e293b"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="600">LATENCY BENCHMARK: p99 = 840ns • p50 = 210ns</text>
      <!-- Sparkline curve -->
      <path d="M 16 50 Q 60 48, 120 40 T 200 45 T 280 32 T 360 42 T 420 35" fill="none" stroke="#6366f1" stroke-width="2"/>
      <circle cx="280" cy="32" r="3" fill="#a5b4fc"/>
    </g>
  </g>
</svg>
