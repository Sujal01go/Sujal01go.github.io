<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="travelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#travelBg)"/>
  
  <g transform="translate(60, 45)">
    <!-- Map Geometry Wireframe Background -->
    <rect x="0" y="0" width="480" height="280" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    
    <!-- Stylized Map Roads / Path Arcs -->
    <path d="M 40 180 Q 140 120, 220 190 T 360 90 T 440 160" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
    <path d="M 60 70 Q 180 90, 240 40 T 420 50" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    
    <!-- Geolocation Pin 1 -->
    <g transform="translate(140, 140)">
      <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.2"/>
      <path d="M 0 -18 C -7 -18, -12 -12, -12 -5 C -12 6, 0 16, 0 16 C 0 16, 12 6, 12 -5 C 12 -12, 7 -18, 0 -18 Z" fill="#0284c7"/>
      <circle cx="0" cy="-6" r="4" fill="#ffffff"/>
    </g>

    <!-- Geolocation Pin 2 (Target Destination) -->
    <g transform="translate(360, 90)">
      <circle cx="0" cy="0" r="22" fill="#f43f5e" opacity="0.15"/>
      <path d="M 0 -22 C -9 -22, -15 -15, -15 -6 C -15 8, 0 20, 0 20 C 0 20, 15 8, 15 -6 C 15 -15, 9 -22, 0 -22 Z" fill="#f43f5e"/>
      <circle cx="0" cy="-7" r="5" fill="#ffffff"/>
    </g>

    <!-- Mobile Diary Card Floating -->
    <g transform="translate(190, 100)">
      <rect x="0" y="0" width="140" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.07))"/>
      <rect x="12" y="12" width="116" height="55" rx="4" fill="#e0f2fe"/>
      <!-- Mountain snapshot outline -->
      <path d="M 22 56 L 50 30 L 75 48 L 95 36 L 118 56 Z" fill="#38bdf8" opacity="0.7"/>
      <text x="12" y="84" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Himachal Expedition</text>
      <text x="12" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">32.24° N, 77.18° E</text>
      <line x1="12" y1="110" x2="110" y2="110" stroke="#f1f5f9" stroke-width="2"/>
      <line x1="12" y1="120" x2="90" y2="120" stroke="#f1f5f9" stroke-width="2"/>
      <text x="12" y="138" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600">SUPABASE + AUTH</text>
    </g>
  </g>
</svg>
