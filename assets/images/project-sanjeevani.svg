<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="herbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#herbBg)"/>
  
  <g transform="translate(60, 45)">
    <!-- Mobile Phone Mockup Wireframe -->
    <rect x="30" y="10" width="160" height="300" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="75" y="18" width="70" height="8" rx="4" fill="#dcfce7"/>
    
    <!-- Mobile UI Content -->
    <rect x="45" y="40" width="130" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="55" y="58" fill="#15803d" font-family="system-ui, sans-serif" font-size="10">🔍 Search "Arthritis"...</text>
    
    <!-- Herb Card in App -->
    <g transform="translate(45, 80)">
      <rect x="0" y="0" width="130" height="95" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
      <!-- Small botanical icon -->
      <path d="M 25 35 C 10 15, 30 10, 35 25 C 40 10, 60 15, 45 35 Z" fill="#22c55e"/>
      <line x1="35" y1="25" x2="35" y2="48" stroke="#15803d" stroke-width="2"/>
      <text x="65" y="32" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Turmeric</text>
      <text x="65" y="46" fill="#166534" font-family="system-ui, sans-serif" font-size="8.5">Curcuma longa</text>
      <rect x="10" y="60" width="110" height="22" rx="4" fill="#15803d"/>
      <text x="65" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Farmer Market • Order</text>
    </g>

    <g transform="translate(45, 190)">
      <rect x="0" y="0" width="130" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Ashwagandha</text>
      <text x="15" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Stress &amp; Vitality Match</text>
    </g>

    <!-- Semantic Mapping Network & Farmer Marketplace -->
    <g transform="translate(230, 40)">
      <rect x="0" y="0" width="220" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="110" y="28" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Symptom-to-Herb Graph</text>
      
      <!-- Nodes -->
      <circle cx="50" cy="80" r="18" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="50" y="84" fill="#991b1b" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SYMPTOM</text>
      
      <circle cx="170" cy="80" r="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
      <text x="170" y="84" fill="#166534" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">HERB (10+)</text>
      
      <circle cx="110" cy="165" r="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="110" y="165" fill="#1e40af" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SUPABASE</text>
      <text x="110" y="177" fill="#2563eb" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">AUTH / DB</text>

      <line x1="68" y1="80" x2="152" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="58" y1="96" x2="96" y2="148" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="162" y1="96" x2="124" y2="148" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="25" y="200" width="170" height="20" rx="4" fill="#f1f5f9"/>
      <text x="110" y="214" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">DIRECT FARMER-TO-USER CONNECT</text>
    </g>
  </g>
</svg>
