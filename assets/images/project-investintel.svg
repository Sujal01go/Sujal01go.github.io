<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#iiGrad)"/>
  
  <!-- Financial Document Wireframe -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2" opacity="0.9"/>
    <line x1="24" y1="36" x2="110" y2="36" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="60" x2="156" y2="60" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="76" x2="140" y2="76" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="92" x2="156" y2="92" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Mini KPI Chart in Document -->
    <rect x="24" y="120" width="132" height="60" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <path d="M 36 160 L 64 146 L 96 152 L 124 134 L 144 138" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="124" cy="134" r="3.5" fill="#1d4ed8"/>
    
    <!-- Document Chunking indicators -->
    <rect x="24" y="196" width="38" height="18" rx="3" fill="#dbeafe"/>
    <rect x="68" y="196" width="44" height="18" rx="3" fill="#dbeafe"/>
  </g>

  <!-- Vector Embedding / Hybrid Search Network -->
  <g transform="translate(260, 70)">
    <!-- Data stream connection lines -->
    <path d="M 0 110 C 60 110, 50 60, 110 60" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 0 110 C 60 110, 50 160, 110 160" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 0 110 L 110 110" stroke="#1d4ed8" stroke-width="2"/>

    <!-- Vector Space Coordinate Frame -->
    <circle cx="150" cy="110" r="85" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" opacity="0.95"/>
    <circle cx="150" cy="110" r="55" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Embeddings Cluster Nodes -->
    <circle cx="125" cy="85" r="5" fill="#2563eb"/>
    <circle cx="138" cy="75" r="4" fill="#3b82f6"/>
    <circle cx="145" cy="95" r="6" fill="#1d4ed8"/>
    <line x1="125" y1="85" x2="145" y2="95" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="138" y1="75" x2="145" y2="95" stroke="#93c5fd" stroke-width="1.5"/>
    
    <circle cx="175" cy="130" r="5" fill="#0284c7"/>
    <circle cx="160" cy="145" r="4" fill="#38bdf8"/>
    <circle cx="185" cy="140" r="5" fill="#0369a1"/>
    <line x1="175" y1="130" x2="160" y2="145" stroke="#bae6fd" stroke-width="1.5"/>
    <line x1="175" y1="130" x2="185" y2="140" stroke="#bae6fd" stroke-width="1.5"/>
    
    <!-- Target Query Vector (FastAPI + Azure OpenAI) -->
    <line x1="150" y1="110" x2="145" y2="95" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <circle cx="150" cy="110" r="4" fill="#dc2626"/>
    
    <!-- Retrieval Badge -->
    <rect x="90" y="210" width="120" height="28" rx="14" fill="#1e40af"/>
    <text x="150" y="228" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">RAG HYBRID RETRIEVAL</text>
  </g>
</svg>
