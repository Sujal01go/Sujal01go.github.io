<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="nightSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#010409" />
    </radialGradient>
    <linearGradient id="astroPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#nightSky)"/>
  
  <!-- Starfield background subtle dots -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="80" cy="90" r="1"/>
    <circle cx="140" cy="50" r="1.5"/>
    <circle cx="210" cy="75" r="1"/>
    <circle cx="290" cy="40" r="1.2"/>
    <circle cx="380" cy="85" r="1"/>
    <circle cx="490" cy="60" r="1.5"/>
    <circle cx="530" cy="110" r="1"/>
    <circle cx="50" cy="220" r="1.2"/>
    <circle cx="110" cy="310" r="1"/>
    <circle cx="520" cy="290" r="1.3"/>
  </g>

  <!-- Celestial Sphere Projection Ring -->
  <g transform="translate(300, 185)">
    <!-- Outer Meridian -->
    <ellipse cx="0" cy="0" rx="150" ry="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="150" ry="45" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
    <!-- Horizon Line -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#0ea5e9" stroke-width="1.5"/>
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    
    <!-- Azimuth Angle Compass Markings -->
    <text x="0" y="-172" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">ZENITH (Z)</text>
    <text x="175" y="4" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">E (90°)</text>
    <text x="-175" y="4" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">W (270°)</text>

    <!-- Ursa Major / Constellation Nodes & Lines -->
    <g stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round">
      <line x1="-70" y1="-65" x2="-45" y2="-80"/>
      <line x1="-45" y1="-80" x2="-20" y2="-72"/>
      <line x1="-20" y1="-72" x2="10" y2="-75"/>
      <line x1="10" y1="-75" x2="25" y2="-45"/>
      <line x1="25" y1="-45" x2="-5" y2="-42"/>
      <line x1="-5" y1="-42" x2="10" y2="-75"/>
    </g>
    <!-- Constellation Stars -->
    <circle cx="-70" cy="-65" r="3.5" fill="#ffffff"/>
    <circle cx="-45" cy="-80" r="3" fill="#ffffff"/>
    <circle cx="-20" cy="-72" r="3" fill="#ffffff"/>
    <circle cx="10" cy="-75" r="4" fill="#fde047"/>
    <circle cx="25" cy="-45" r="4.5" fill="#fde047"/>
    <circle cx="-5" cy="-42" r="3.5" fill="#ffffff"/>

    <!-- Polaris Star (North Celestial Pole) -->
    <circle cx="0" cy="-110" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="-110" r="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <text x="16" y="-106" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">POLARIS (HIP 11767)</text>

    <!-- Current Device Attitude / AR Crosshair -->
    <circle cx="65" cy="-30" r="18" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="42" y1="-30" x2="88" y2="-30" stroke="#ef4444" stroke-width="1"/>
    <line x1="65" y1="-53" x2="65" y2="-7" stroke="#ef4444" stroke-width="1"/>
    <text x="65" y="3" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Alt 42.1° • Az 118°</text>
  </g>

  <!-- Technical Label Pill -->
  <g transform="translate(180, 350)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
    <text x="120" y="17" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="0.5">HIPPARCOS &amp; YALE CATALOG ENGINE</text>
  </g>
</svg>
